<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MySLT Tracker</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <img src="icons/icon48.png" alt="MySLT Tracker" class="header-icon">
      <div class="header-title">
        <h2>MySLT Tracker</h2>
        <span id="accountBadge" class="account-badge" style="display:none;"></span>
      </div>
    </div>
    <div class="header-actions">
      <button id="fullscreenBtn" title="Open Full Screen">⛶</button>
      <button id="settingsBtn" title="Settings">⚙</button>
      <button id="refreshBtn" title="Refresh">↻</button>
    </div>
  </div>

  <div class="bill-card">
    <div class="bill-main">
      <span class="bill-label">Total Payable</span>
      <span class="bill-amount" id="totalBill">Loading...</span>
    </div>
    <div class="bill-meta" id="billMeta" style="display:none;"></div>
  </div>

  <!-- Setup Form -->
  <div id="setupBox" class="setup-box" style="display:none;">
    <input type="text" id="tokenInput" placeholder="Paste Token Here">
    <input type="text" id="phoneInput" placeholder="Telephone No (e.g. 0112345678 or 94112345678)">
    <input type="text" id="accInput" placeholder="Account No (e.g. 0012345678)">
    <div class="setup-actions">
      <button id="saveBtn" type="button" class="save-btn">Save & Connect</button>
      <button id="resetBtn" type="button" class="reset-btn">Reset Settings</button>
    </div>
  </div>

  <!-- Total Summary Card -->
  <div id="summaryCard" class="summary-card" style="display:none;"></div>

  <!-- මෙන්න මේ element එක අනිවාර්යයෙන්ම popup.html එකේ තියෙන්න ඕනේ! -->
  <div id="usageContainer" class="usage-container">
    <p class="status-msg">Loading data...</p>
  </div>

  <footer class="popup-footer">
    Developed by <a href="https://imeshsan2008.is-a.dev/" target="_blank" rel="noreferrer">imeshsan2008</a>
  </footer>

  <script src="slt_utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
